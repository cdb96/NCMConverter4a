name: CI

on:
  workflow_dispatch:
  push:
    branches: ["master", "cmp_preview"]
  pull_request:
    branches: ["master", "cmp_preview"]
  release:
    types: [published]

jobs:
  # Pushes, manual runs and published releases build Release artifacts by default.
  # PRs keep the check-only flow because signing secrets may be unavailable.
  changes:
    runs-on: ubuntu-latest
    outputs:
      full_build: ${{ steps.scope.outputs.full_build }}
    steps:
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            full_build=false
          else
            full_build=true
          fi
          echo "full_build=${full_build}" >> "$GITHUB_OUTPUT"

  # ======================== Android Build ========================
  android:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 设置 Android SDK 和 NDK
        uses: android-actions/setup-android@v4
        with:
          # Android 原生构建所需的 NDK 版本 (见 androidApp/build.gradle.kts)
          packages: ndk;30.0.16248370

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 拉取 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 缓存 Gradle Configuration Cache
        uses: actions/cache@v5
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            gradle-config-${{ runner.os }}-android-

      - name: 构建 Debug APK (PR check)
        if: ${{ needs.changes.outputs.full_build != 'true' }}
        run: ./gradlew :androidApp:assembleDebug

      - name: 设置 Keystore 文件 (release)
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > androidApp/release.keystore

      - name: 构建发布版 APK (release)
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: ./gradlew :androidApp:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_FILE: release.keystore

      - name: 上传 APK
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

      - name: 上传 Debug APK (PR check)
        if: ${{ needs.changes.outputs.full_build != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: 创建 GitHub Release (Android)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: androidApp/build/outputs/apk/release/*.apk

  # PRs run tests plus a JVM compile check on one OS only.
  # No installers, no jmods, no artifacts.
  desktop-check:
    needs: changes
    if: ${{ needs.changes.outputs.full_build != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 拉取 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 缓存 Gradle Configuration Cache
        uses: actions/cache@v5
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ runner.os }}-desktop-check-${{ github.sha }}
          restore-keys: |
            gradle-config-${{ runner.os }}-desktop-check-

      # The shared C++ core has a JVM-free self-test: it pins the RC4 golden
      # vector and compares KGM byte-for-byte against the retired implementation.
      - name: 安装 native 构建工具
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: 校验共享 native core
        run: bash native/tests/check.sh

      - name: 运行 Desktop/common 回归测试
        run: ./gradlew :composeApp:desktopTest --configure-on-demand

      # desktopTest builds the core through cmake (Ninja, single config), which
      # also produces the JVM-free self-test next to the library.
      - name: 运行 native core 自检
        run: ./native/build/ncm_core_selftest

      - name: 桌面编译检查
        run: ./gradlew :composeApp:compileKotlinDesktop --configure-on-demand

  # ======================== Desktop Release Build ========================
  # Push / manual run / published release: multi-OS installers and Uber Jar.
  desktop:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.full_build == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # softprops/action-gh-release 发布 Release 需要
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 拉取 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 缓存 Gradle Configuration Cache
        uses: actions/cache@v5
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ runner.os }}-desktop-${{ github.sha }}
          restore-keys: |
            gradle-config-${{ runner.os }}-desktop-

      - name: 运行 Desktop/common 回归测试
        shell: bash
        run: ./gradlew :composeApp:desktopTest --configure-on-demand

      - name: 验证 Windows native 库独立加载
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'composeApp/build/generated/desktopNativeResources/ncmc4a/windows-x86_64/ncmc4a.dll').Path
          $objdump = Get-Command objdump -ErrorAction SilentlyContinue
          if ($objdump) { & $objdump.Source -p $dll | Select-String 'DLL Name:' }
          $env:PATH = "$env:JAVA_HOME\bin;$env:SystemRoot\System32;$env:SystemRoot"
          & "$env:JAVA_HOME\bin\java.exe" native/tests/NativeLibraryLoadCheck.java $dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 构建桌面安装包 (release)
        shell: bash
        run: |
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --configure-on-demand --no-configuration-cache

      - name: 构建 Uber Jar (release)
        # 独立编译, 产物在 composeApp/build/compose/jars/, 与安装包目录分开
        shell: bash
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS --configure-on-demand

      - name: 上传桌面分发版 (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-linux
          path: composeApp/build/compose/binaries/main-release/deb/*.deb

      - name: 上传桌面分发版 (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-macos
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

      - name: 上传桌面分发版 (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-windows
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

      - name: 上传 Uber Jar
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-jar-${{ runner.os }}
          path: composeApp/build/compose/jars/*.jar

      - name: 创建 GitHub Release (Desktop)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: |
            composeApp/build/compose/binaries/main-release/deb/*.deb
            composeApp/build/compose/binaries/main-release/dmg/*.dmg
            composeApp/build/compose/binaries/main-release/msi/*.msi
            composeApp/build/compose/jars/*.jar

  # ======================== Windows Native Image ========================
  windows-native-image:
    needs: changes
    if: ${{ needs.changes.outputs.full_build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Windows UberJar
        shell: pwsh
        run: ./gradlew.bat :composeApp:packageReleaseUberJarForCurrentOS --configure-on-demand

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Trace conversion and desktop metadata
        shell: pwsh
        run: |
          $jar = Get-ChildItem composeApp/build/compose/jars/*-release.jar | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $jar) { throw 'Release UberJar not found' }
          $metadata = Join-Path $PWD.Path 'build/native-image/metadata'
          $classes = Join-Path $PWD.Path 'build/native-image/trace-classes'
          New-Item -ItemType Directory -Force $metadata,$classes | Out-Null
          & "$env:JAVA_HOME\bin\javac.exe" -cp $jar.FullName -d $classes '.github/native-image/NativeImageMain.java' '.github/native-image/FilePickerSmoke.java' '.github/native-image/PgoTraining.java'
          if ($LASTEXITCODE -ne 0) { throw "Trace helper compilation failed: $LASTEXITCODE" }
          $classPath = "$classes;$($jar.FullName)"
          $traceAppData = Join-Path $PWD.Path 'build/native-image/trace-appdata'
          $renderConfig = Join-Path $traceAppData 'NCMConverter4a/rendering.properties'
          New-Item -ItemType Directory -Force (Split-Path $renderConfig) | Out-Null
          $originalAppData = $env:APPDATA
          try {
            $env:APPDATA = $traceAppData
            foreach ($gpu in @('true', 'false')) {
              "gpuRendering=$gpu" | Set-Content -LiteralPath $renderConfig -Encoding ascii
              $agentMode = if ($gpu -eq 'true') { 'config-output-dir' } else { 'config-merge-dir' }
              $agentOption = "-agentlib:native-image-agent=${agentMode}=$metadata,config-write-period-secs=5,config-write-initial-delay-secs=1"
              $traceOutput = & "$env:JAVA_HOME\bin\java.exe" $agentOption '--enable-native-access=ALL-UNNAMED' '-Dsun.java2d.d3d=false' -cp $classPath 'NativeImageMain' '--pgo-train' 2>&1
              $traceExit = $LASTEXITCODE
              $traceOutput | ForEach-Object { Write-Host $_ }
              if ($traceExit -ne 0) { throw "gpuRendering=$gpu desktop tracing failed: $traceExit" }
              $expected = if ($gpu -eq 'true') { 'DIRECT3D' } else { 'SOFTWARE_FAST' }
              if (-not (($traceOutput | Out-String).Contains("Skiko renderer: $expected"))) {
                throw "Tracing ignored gpuRendering=$gpu"
              }
            }
          } finally {
            $env:APPDATA = $originalAppData
          }
          Get-ChildItem $metadata -Force | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }
          if (-not (Test-Path (Join-Path $metadata 'reachability-metadata.json'))) {
            throw 'GraalVM tracing did not produce reachability-metadata.json'
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NCMConverter4a-graalvm-tracing-metadata
          path: build/native-image/metadata/*
          if-no-files-found: warn

      - name: Build and train PGO Native Image
        shell: pwsh
        run: |
          native-image --version
          $jar = Get-ChildItem composeApp/build/compose/jars/*-release.jar | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $jar) { throw 'Release UberJar not found' }
          $metadata = Join-Path $PWD.Path 'build/native-image/metadata'
          $staticMetadata = Join-Path $PWD.Path '.github/native-image/metadata'
          $dpiManifest = Join-Path $PWD.Path '.github/native-image/NCMConverter4a.exe.manifest'
          Write-Host "UberJar: $($jar.FullName) ($($jar.Length) bytes)"
          New-Item -ItemType Directory -Force build/native-image | Out-Null
          Push-Location build/native-image
          $classes = Join-Path $PWD.Path 'trace-classes'
          $classPath = "$classes;$($jar.FullName)"
          # This Windows/AWT build loads DLLs at runtime; Native Image cannot make this target fully static.
          $nativeImageArgs = @(
            '--no-fallback'
            '--enable-native-access=ALL-UNNAMED'
            # Keep GraalVM's mainCRTStartup entry while using the Windows GUI subsystem.
            '-H:NativeLinkerOption=/SUBSYSTEM:WINDOWS'
            '-H:NativeLinkerOption=/ENTRY:mainCRTStartup'
            "-H:ConfigurationFileDirectories=$metadata,$staticMetadata"
            '-cp', $classPath
          )
          native-image @nativeImageArgs '--pgo-instrument' 'NativeImageMain' 'NCMConverter4a-instrumented'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mt = (Get-Command mt.exe -ErrorAction SilentlyContinue).Source
          if (-not $mt) {
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
            $mt = Get-ChildItem -LiteralPath $sdkBin -Directory | Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64/mt.exe' } |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $mt) { throw 'Windows SDK manifest tool mt.exe not found' }
          $instrumentedPath = Join-Path $PWD 'NCMConverter4a-instrumented.exe'
          & $mt -manifest $dpiManifest "-outputresource:$instrumentedPath;#1"
          if ($LASTEXITCODE -ne 0) { throw "Embedding DPI manifest failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item -LiteralPath jawt.dll -Destination bin/jawt.dll -Force
          if (-not (Test-Path awt.dll)) { throw "Expected AWT library at $PWD/awt.dll" }
          if (-not (Test-Path bin/jawt.dll)) { throw "Expected AWT support library at $PWD/bin/jawt.dll" }
          $fontConfig = Join-Path $env:JAVA_HOME 'lib/fontconfig.bfc'
          if (-not (Test-Path $fontConfig)) { throw "Expected JDK font configuration at $fontConfig" }
          New-Item -ItemType Directory -Force lib | Out-Null
          Copy-Item -LiteralPath $fontConfig -Destination lib/fontconfig.bfc -Force
          $pgoDir = Join-Path $PWD 'pgo'
          $smokeAppData = Join-Path $PWD 'smoke-appdata'
          New-Item -ItemType Directory -Force $pgoDir,(Join-Path $smokeAppData 'NCMConverter4a') | Out-Null
          $originalAppData = $env:APPDATA
          try {
            $env:APPDATA = $smokeAppData
            foreach ($gpu in @('true', 'false')) {
              "gpuRendering=$gpu" | Set-Content -LiteralPath (Join-Path $smokeAppData 'NCMConverter4a/rendering.properties') -Encoding ascii
              $rawProfile = Join-Path $PWD 'default.iprof'
              if (Test-Path -LiteralPath $rawProfile) { throw "Unexpected profile already exists: $rawProfile" }
              $stdout = Join-Path $PWD "pgo-train-$gpu.stdout.log"
              $stderr = Join-Path $PWD "pgo-train-$gpu.stderr.log"
              $process = Start-Process -FilePath $instrumentedPath -ArgumentList '--pgo-train' -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              Get-Content -LiteralPath $stdout
              Get-Content -LiteralPath $stderr
              if ($process.ExitCode -ne 0) { throw "PGO training with gpuRendering=$gpu failed: $($process.ExitCode)" }
              $profile = Get-Item -LiteralPath $rawProfile -ErrorAction Stop
              if ($profile.Length -eq 0) { throw "PGO training produced an empty profile for gpuRendering=$gpu" }
              $expected = if ($gpu -eq 'true') { 'DIRECT3D' } else { 'SOFTWARE_FAST' }
              if (-not (Select-String -LiteralPath $stdout -Pattern "Skiko renderer: $expected" -SimpleMatch -Quiet)) {
                throw "PGO training ignored gpuRendering=$gpu"
              }
              Move-Item -LiteralPath $rawProfile -Destination (Join-Path $pgoDir "startup-$gpu.iprof") -Force
            }
          } finally {
            $env:APPDATA = $originalAppData
          }
          $profilePaths = @('true', 'false') | ForEach-Object { Join-Path $pgoDir "startup-$_.iprof" }
          $profileOption = '--pgo=' + ($profilePaths -join ',')
          native-image @nativeImageArgs $profileOption 'NativeImageMain' 'NCMConverter4a'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imagePath = Join-Path $PWD 'NCMConverter4a.exe'
          & $mt -manifest $dpiManifest "-outputresource:$imagePath;#1"
          if ($LASTEXITCODE -ne 0) { throw "Embedding DPI manifest failed: $LASTEXITCODE" }
          Copy-Item -LiteralPath jawt.dll -Destination bin/jawt.dll -Force
          # GUI-subsystem executables must be explicitly waited on by PowerShell.
          foreach ($smoke in @('--native-smoke', '--file-picker-smoke')) {
            $name = $smoke.TrimStart('-')
            $stdout = Join-Path $PWD "$name.stdout.log"
            $stderr = Join-Path $PWD "$name.stderr.log"
            $process = Start-Process -FilePath $imagePath -ArgumentList $smoke -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Get-Content -LiteralPath $stdout
            Get-Content -LiteralPath $stderr
            if ($process.ExitCode -ne 0) { throw "Native Image $smoke failed: $($process.ExitCode)" }
          }
          $originalAppData = $env:APPDATA
          $smokeAppData = Join-Path $PWD 'smoke-appdata'
          New-Item -ItemType Directory -Force (Join-Path $smokeAppData 'NCMConverter4a') | Out-Null
          $env:APPDATA = $smokeAppData
          foreach ($gpu in @('true', 'false')) {
            "gpuRendering=$gpu" | Set-Content -LiteralPath (Join-Path $smokeAppData 'NCMConverter4a/rendering.properties') -Encoding ascii
            $stdout = Join-Path $PWD "startup-$gpu.stdout.log"
            $stderr = Join-Path $PWD "startup-$gpu.stderr.log"
            $process = Start-Process -FilePath $imagePath -ArgumentList '--startup-smoke' -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Get-Content -LiteralPath $stdout
            Get-Content -LiteralPath $stderr
            if ($process.ExitCode -ne 0) { throw "Native Image startup with gpuRendering=$gpu failed: $($process.ExitCode)" }
            $expected = if ($gpu -eq 'true') { 'DIRECT3D' } else { 'SOFTWARE_FAST' }
            if (-not (Select-String -LiteralPath $stdout -Pattern "Skiko renderer: $expected" -SimpleMatch -Quiet)) {
              throw "Native Image startup ignored gpuRendering=$gpu"
            }
          }
          $env:APPDATA = $originalAppData
          $image = Get-Item -LiteralPath (Join-Path $PWD 'NCMConverter4a.exe')
          $runtimeFiles = @($image) + @(Get-ChildItem -LiteralPath $PWD.Path -Filter '*.dll' -File) + @(
            (Get-Item -LiteralPath (Join-Path $PWD 'bin/jawt.dll'))
            (Get-Item -LiteralPath (Join-Path $PWD 'lib/fontconfig.bfc'))
          )
          $runtimeBytes = ($runtimeFiles | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Native Image executable (PGO): {0:N2} MiB ({1} bytes)" -f ($image.Length / 1MB), $image.Length)
          Write-Host ("Windows runtime files: {0:N2} MiB ({1} bytes)" -f ($runtimeBytes / 1MB), $runtimeBytes)
          "Native Image executable (PGO): $($image.Length) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Windows runtime files (EXE, generated DLLs, font config): $runtimeBytes bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Pop-Location
          Get-ChildItem build/native-image -Recurse -File | Select-Object FullName,Length

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NCMConverter4a-graalvm-windows-experiment
          path: |
            build/native-image/NCMConverter4a.exe
            build/native-image/*.dll
            build/native-image/bin/jawt.dll
            build/native-image/lib/fontconfig.bfc
            build/native-image/*.log
          if-no-files-found: warn
