name: CI

on:
  workflow_dispatch:
  push:
    branches: ["master", "cmp_preview"]
  pull_request:
    branches: ["master", "cmp_preview"]
  release:
    types: [published]

jobs:
  # Pushes, manual runs and published releases build Release artifacts by default.
  # PRs keep the check-only flow because signing secrets may be unavailable.
  changes:
    runs-on: ubuntu-latest
    outputs:
      full_build: ${{ steps.scope.outputs.full_build }}
    steps:
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            full_build=false
          else
            full_build=true
          fi
          echo "full_build=${full_build}" >> "$GITHUB_OUTPUT"

  # ======================== Android Build ========================
  android:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 设置 Android SDK 和 NDK
        uses: android-actions/setup-android@v4
        with:
          # Android 原生构建所需的 NDK 版本 (见 androidApp/build.gradle.kts)
          packages: ndk;30.0.16248370

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 拉取 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 缓存 Gradle Configuration Cache
        uses: actions/cache@v5
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            gradle-config-${{ runner.os }}-android-

      - name: 构建 Debug APK (PR check)
        if: ${{ needs.changes.outputs.full_build != 'true' }}
        run: ./gradlew :androidApp:assembleDebug

      - name: 设置 Keystore 文件 (release)
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > androidApp/release.keystore

      - name: 构建发布版 APK (release)
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: ./gradlew :androidApp:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_FILE: release.keystore

      - name: 上传 APK
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

      - name: 上传 Debug APK (PR check)
        if: ${{ needs.changes.outputs.full_build != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: 创建 GitHub Release (Android)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: androidApp/build/outputs/apk/release/*.apk

  # PRs run tests plus a JVM compile check on one OS only.
  # No installers, no jmods, no artifacts.
  desktop-check:
    needs: changes
    if: ${{ needs.changes.outputs.full_build != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 拉取 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 缓存 Gradle Configuration Cache
        uses: actions/cache@v5
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ runner.os }}-desktop-check-${{ github.sha }}
          restore-keys: |
            gradle-config-${{ runner.os }}-desktop-check-

      # The shared C++ core has a JVM-free self-test: it pins the RC4 golden
      # vector and compares KGM byte-for-byte against the retired implementation.
      - name: 安装 native 构建工具
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: 校验共享 native core
        run: bash native/check.sh

      - name: 运行 Desktop/common 回归测试
        run: ./gradlew :composeApp:desktopTest --configure-on-demand

      # desktopTest builds the core through cmake (Ninja, single config), which
      # also produces the JVM-free self-test next to the library.
      - name: 运行 native core 自检
        run: ./native/build/ncm_core_selftest

      - name: 桌面编译检查
        run: ./gradlew :composeApp:compileKotlinDesktop --configure-on-demand

  # ======================== Desktop Release Build ========================
  # Push / manual run / published release: multi-OS installers and Uber Jar.
  desktop:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.full_build == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # softprops/action-gh-release 发布 Release 需要
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 拉取 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 缓存 Gradle Configuration Cache
        uses: actions/cache@v5
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ runner.os }}-desktop-${{ github.sha }}
          restore-keys: |
            gradle-config-${{ runner.os }}-desktop-

      - name: 运行 Desktop/common 回归测试
        shell: bash
        run: ./gradlew :composeApp:desktopTest --configure-on-demand

      - name: 验证 Windows native 库独立加载
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'composeApp/build/generated/desktopNativeResources/ncmc4a/windows-x86_64/ncmc4a.dll').Path
          $env:PATH = "$env:JAVA_HOME\bin;$env:SystemRoot\System32;$env:SystemRoot"
          & "$env:JAVA_HOME\bin\java.exe" native/check/NativeLibraryLoadCheck.java $dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 构建桌面安装包 (release)
        shell: bash
        run: |
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --configure-on-demand --no-configuration-cache

      - name: 构建 Uber Jar (release)
        # 独立编译, 产物在 composeApp/build/compose/jars/, 与安装包目录分开
        shell: bash
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS --configure-on-demand

      - name: 上传桌面分发版 (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-linux
          path: composeApp/build/compose/binaries/main-release/deb/*.deb

      - name: 上传桌面分发版 (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-macos
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

      - name: 上传桌面分发版 (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-windows
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

      - name: 上传 Uber Jar
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-jar-${{ runner.os }}
          path: composeApp/build/compose/jars/*.jar

      - name: 创建 GitHub Release (Desktop)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: |
            composeApp/build/compose/binaries/main-release/deb/*.deb
            composeApp/build/compose/binaries/main-release/dmg/*.dmg
            composeApp/build/compose/binaries/main-release/msi/*.msi
            composeApp/build/compose/jars/*.jar
