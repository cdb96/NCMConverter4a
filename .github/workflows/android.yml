name: CI

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  release:
    types: [published]

jobs:
  # ======================== Android Build ========================
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/configuration-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 设置 Keystore 文件
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > androidApp/release.keystore

      - name: 构建发布版 APK
        if: ${{ github.event_name != 'pull_request' }}
        run: ./gradlew :androidApp:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_FILE: release.keystore

      - name: 构建 Debug APK (PR check)
        if: ${{ github.event_name == 'pull_request' }}
        run: ./gradlew :androidApp:assembleDebug

      - name: 上传 APK
        # PR 只构建 debug APK (release/ 目录不存在), 跳过上传避免 upload-artifact 报错
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

      - name: 创建 GitHub Release (Android)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: androidApp/build/outputs/apk/release/*.apk

  # ======================== Desktop Build ========================
  desktop:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # softprops/action-gh-release 发布 Release 需要
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 接受 SDK licenses 并安装 NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER.bat" ] && SDKMANAGER="$SDKMANAGER.bat"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;30.0.15729638"

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/configuration-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 构建桌面分发版
        run: ./gradlew :composeApp:createDistributable

      - name: 上传桌面分发版 (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-linux
          path: composeApp/build/compose/binaries/main/deb/*.deb

      - name: 上传桌面分发版 (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-macos
          path: composeApp/build/compose/binaries/main/dmg/*.dmg

      - name: 上传桌面分发版 (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-windows
          path: composeApp/build/compose/binaries/main/msi/*.msi

      - name: 创建 GitHub Release (Desktop)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: |
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/msi/*.msi
