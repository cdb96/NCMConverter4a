name: CI

on:
  workflow_dispatch:
  push:
    branches: ["master", "cmp_preview"]
  pull_request:
    branches: ["master", "cmp_preview"]
  release:
    types: [published]

jobs:
  # Decides the scope of the run. cmp_preview is a development preview branch,
  # so it only gets test/compile checks. Full release packaging (Android signed
  # release, MSI/DMG/DEB, Uber Jar, artifacts, GitHub Release) is reserved for
  # master pushes and published releases.
  changes:
    runs-on: ubuntu-latest
    outputs:
      full_build: ${{ steps.scope.outputs.full_build }}
    steps:
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "release" ] || { [ "${EVENT_NAME}" = "push" ] && [ "${REF_NAME}" = "master" ]; }; then
            full_build=true
          else
            full_build=false
          fi
          echo "full_build=${full_build}" >> "$GITHUB_OUTPUT"

  # ======================== Android Build ========================
  android:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 设置 Android SDK 和 NDK
        uses: android-actions/setup-android@v4
        with:
          # Android 原生构建所需的 NDK 版本 (见 androidApp/build.gradle.kts)
          packages: ndk;30.0.16248370

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 缓存 Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/configuration-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 构建 Debug APK (preview / PR check)
        if: ${{ needs.changes.outputs.full_build != 'true' }}
        run: ./gradlew :androidApp:assembleDebug

      - name: 设置 Keystore 文件 (release)
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > androidApp/release.keystore

      - name: 构建发布版 APK (release)
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: ./gradlew :androidApp:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_FILE: release.keystore

      - name: 上传 APK
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

      - name: 上传 Debug APK (preview / PR check)
        if: ${{ needs.changes.outputs.full_build != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: 创建 GitHub Release (Android)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: androidApp/build/outputs/apk/release/*.apk

  # Runs on every push/PR: tests plus a JVM compile check, on one OS only.
  # No installers, no jmods, no artifacts.
  desktop-check:
    needs: changes
    if: ${{ needs.changes.outputs.full_build != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v6

      # The shared C++ core has a JVM-free self-test: it pins the RC4 golden
      # vector and compares KGM byte-for-byte against the retired implementation.
      - name: 安装 native 构建工具
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: 校验共享 native core
        run: bash native/check.sh

      - name: 运行 Desktop/common 回归测试
        run: ./gradlew :composeApp:desktopTest --configure-on-demand

      # desktopTest builds the core through cmake (Ninja, single config), which
      # also produces the JVM-free self-test next to the library.
      - name: 运行 native core 自检
        run: ./native/build/ncm_core_selftest

      - name: 桌面编译检查
        run: ./gradlew :composeApp:compileKotlinDesktop --configure-on-demand

  # ======================== Desktop Release Build ========================
  # master push / published release only: multi-OS installers and Uber Jar.
  desktop:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.full_build == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # softprops/action-gh-release 发布 Release 需要
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: 设置 submodules
        run: git submodule update --init --recursive

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 授予 Gradlew 执行权限
        run: chmod +x gradlew

      - name: 缓存 Gradle 依赖
        uses: gradle/actions/setup-gradle@v6

      - name: 运行 Desktop/common 回归测试
        shell: bash
        run: ./gradlew :composeApp:desktopTest --configure-on-demand

      - name: 构建桌面安装包 (release)
        shell: bash
        run: |
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --configure-on-demand

      - name: 构建 Uber Jar (release)
        # 独立编译, 产物在 composeApp/build/compose/jars/, 与安装包目录分开
        shell: bash
        run: |
          ./gradlew :composeApp:packageReleaseUberJarForCurrentOS --configure-on-demand

      - name: 上传桌面分发版 (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-linux
          path: composeApp/build/compose/binaries/main-release/deb/*.deb

      - name: 上传桌面分发版 (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-macos
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

      - name: 上传桌面分发版 (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-windows
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

      - name: 上传 Uber Jar
        uses: actions/upload-artifact@v7
        with:
          name: NCMConverter4a-jar-${{ runner.os }}
          path: composeApp/build/compose/jars/*.jar

      - name: 创建 GitHub Release (Desktop)
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: |
            composeApp/build/compose/binaries/main-release/deb/*.deb
            composeApp/build/compose/binaries/main-release/dmg/*.dmg
            composeApp/build/compose/binaries/main-release/msi/*.msi
            composeApp/build/compose/jars/*.jar
